name: Render the Monday carousel

# Fires when the Apps Script project commits a week's spec. It NEVER fires on
# the PDF and PNG this workflow itself commits, because those do not match the
# path filter, so it cannot retrigger itself.
on:
  push:
    branches: [main]
    paths:
      - 'carousel/*.json'
  workflow_dispatch:
    inputs:
      spec:
        description: 'Path of the spec to render, e.g. carousel/2026-10-05.json'
        required: true

permissions:
  contents: write

concurrency:
  group: render-carousel
  cancel-in-progress: false

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Which spec
        id: pick
        run: |
          set -uo pipefail
          # WHY NOT git diff-tree, which is the obvious way: the checkout is
          # shallow, so the pushed commit has no parent here and diff-tree
          # lists nothing. That is how this job failed on its very first run
          # (2026-09-27). The working tree is the reliable source.
          if [ -n "${{ github.event.inputs.spec }}" ]; then
            spec="${{ github.event.inputs.spec }}"
          else
            # Every spec with no rendered deck beside it, newest last. A spec
            # whose PDF already exists is finished, and re-rendering it would
            # replace a deck that may already be scheduled in Buffer.
            spec=""
            for f in $(ls carousel/*.json 2>/dev/null | sort); do
              base="${f%.json}"
              if [ ! -f "$base.pdf" ]; then spec="$f"; fi
            done
          fi
          if [ -z "$spec" ] || [ ! -f "$spec" ]; then
            # Not a failure. A push that touches this repository without
            # adding a week's stories is an ordinary push.
            echo "Nothing to render; every spec already has its deck."
            echo "spec=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "spec=$spec" >> "$GITHUB_OUTPUT"
          echo "Rendering $spec"

      - name: Install the renderer
        if: steps.pick.outputs.spec != ''
        working-directory: render
        run: npm install --no-audit --no-fund

      - name: The guards that fail quietly
        if: steps.pick.outputs.spec != ''
        working-directory: render
        run: node test.js

      - name: Render
        if: steps.pick.outputs.spec != ''
        run: node render/render.js "${{ steps.pick.outputs.spec }}"
        env:
          PUPPETEER_CACHE_DIR: /home/runner/.cache/puppeteer
          # The picture check (render/picture-rules.json). Without this
          # secret every picture is left out and the slides show numbers.
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit the deck
        if: steps.pick.outputs.spec != ''
        run: |
          set -euo pipefail
          base="$(basename "${{ steps.pick.outputs.spec }}" .json)"
          git config user.name  "carousel-renderer"
          git config user.email "noreply@github.com"
          git add "carousel/$base.pdf" "carousel/$base.png"
          if git diff --cached --quiet; then
            echo "Nothing changed."
            exit 0
          fi
          git commit -m "Rendered carousel for $base"
          # The Apps Script side is polling the raw address of the PDF, so a
          # push that fails must fail the job loudly rather than leave it
          # waiting until its 21:00 deadline.
          git push
